# Tool configuration only. The backend is an application, not an installable package.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
